openapi: 3.1.0
info:
  title: Broker Dynamic API (MN)
  version: 1.0.0
  description: |-
    Broker Dynamic API Postman collection

    === Ерөнхий урсгал ===
    1. POST /api/broker/get_token
    - Broker username, password-оор token авна.

    2. POST /api/broker/get-driver
    - Регистрийн дугаараар жолооч / иргэний мэдээлэл татна.
    - XYP ашигладаг.
    - Зөвхөн XYP ашиглах эрхтэй хэрэглэгч ашиглана.

    3. POST /api/broker/get-vehicle
    - Улсын дугаараар тээврийн хэрэгслийн мэдээлэл татна.
    - XYP ашигладаг.
    - Зөвхөн XYP ашиглах эрхтэй хэрэглэгч ашиглана.

    4. GET /api/broker/products
    - Ашиглах боломжтой бүтээгдэхүүний жагсаалт авна.
    - Product бүр дээр is_active boolean буцна.

    5. GET /api/broker/products/{product_key}/category
    - Сонгосон product_key-ийн category авна.
    - category утга:
      - mashin
      - oron_suuts
      - ed_hurungu

    6. GET /api/broker/{product_key}/get_sets
    - Сонгосон бүтээгдэхүүний багцуудыг авна.

    7. POST /api/broker/{product_key}/create
    - Сонгосон бүтээгдэхүүний гэрээ үүсгэнэ.

    8. POST /api/broker/{product_key}/upload_photos
    - Гэрээ үүссэний дараа тээврийн хэрэгслийн зургууд upload хийнэ.
    - Зөвхөн thd, ht, thd_loan дээр ажиллана.

    9. POST /api/broker/{product_key}/check_pay
    - Төлбөрийн төлөв шалгана.
    - Төлөгдсөн бол contract_url буцаана.

    10. POST /api/broker/{product_key}/contract
    - Нэг гэрээний дэлгэрэнгүй мэдээлэл авна.

    11. POST /api/broker/{product_key}/contracts
    - Огнооны интервалаар гэрээнүүдийн жагсаалт авна.

    12. POST /api/broker/contract-lookup
    - plate_number эсвэл regnum-ээр бүх бүтээгдэхүүн дундаас гэрээтэй эсэхийг шалгана.
    - has_active_contract болон олдсон гэрээнүүдийн жагсаалт буцаана.
    - Зөвхөн иргэний regnum дэмжигдэнэ, байгууллагын regnum дэмжигдэхгүй.

    === Бүтээгдэхүүний key ===
    - thd
    - ht
    - god
    - thd_loan
    - ajd
    - sgo

    === Нэмэлт тайлбар ===
    - THD нь хуучин /api/broker/thd/* flow-ийг яг тэр чигээр нь ашиглана.
    - HT, GOD, THD loan, AJD, SGO нь broker dynamic controller-оор орно.
    - AJD get_sets нь хоосон жагсаалт буцаана.
    - THD get_sets нь хуучин THD sets response-ээ яг тэр чигээр нь ашиглана.
    - GOD, SGO get_sets нь common broker structure дээр insurance_type, protection_amount, price талбаруудыг нэмээд буцаана.
    - Баталгаажсан token-ийг Authorization: <token> хэлбэрээр protected endpoint бүр дээр дамжуулна.
    - set утга нь тухайн product-ийн get_sets endpoint-ээс авсан key/id байна.
servers:
- url: https://ubd.smartdaatgal.mn
tags:
- name: auth
  description: Broker token авах endpoint.
- name: commonEndpoints
  description: Бүх product дээр адилхан хэрэглэгдэх broker API endpoint-үүд.
- name: thd
  description: THD нь хуучин broker THD API flow-ийг яг тэр чигээр нь ашиглана.
- name: ht
  description: HT нь THD-тэй төстэй request body хүлээж авна. owner талбар driver руу normalize хийгдэнэ.
- name: god
  description: GOD broker flow. Зөвхөн иргэний гэрээ дэмжинэ.
- name: thdLoan
  description: THD loan нь company + owner + vehicle бүтэцтэй, THD-тэй төстэй payload хүлээнэ.
- name: ajd
  description: AJD broker flow. is_limited-ийг backend үргэлж false болгож MIIS рүү явуулна.
- name: sgo
  description: SGO broker flow. Зөвхөн суудлын гэнэтийн ослын даатгалын гэрээ үүсгэнэ.
paths:
  /api/broker/get_token:
    post:
      tags:
      - auth
      summary: Get Token
      operationId: getToken
      description: |-
        Broker token авна.

        Буцаасан token-ийг дараагийн хүсэлтүүд дээр:
        Authorization: <token>
        хэлбэрээр дамжуулна.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
            examples:
              Get_Token:
                summary: Get Token
                value:
                  username: your_broker_username
                  password: your_broker_password
  /api/broker/get-driver:
    post:
      tags:
      - commonEndpoints
      summary: Get Driver
      operationId: getDriver
      description: |-
        Регистрийн дугаараар жолооч / иргэний мэдээлэл татна.

        Энэ endpoint нь XYP lookup ашигладаг.

        Анхаарах зүйл:
        - Broker token-оо Authorization header дээр дамжуулна.
        - Зөвхөн XYP ашиглах эрхтэй хэрэглэгч ашиглана.
        - Энэ endpoint нь create-ийн өмнөх туслах autofill endpoint юм.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                regnum:
                  type: string
            examples:
              Get_Driver:
                summary: Get Driver
                value:
                  regnum: АБ12345678
  /api/broker/get-vehicle:
    post:
      tags:
      - commonEndpoints
      summary: Get Vehicle
      operationId: getVehicle
      description: |-
        Улсын дугаараар тээврийн хэрэгслийн мэдээлэл татна.

        Энэ endpoint нь XYP lookup ашигладаг.

        Анхаарах зүйл:
        - Broker token-оо Authorization header дээр дамжуулна.
        - Зөвхөн XYP ашиглах эрхтэй хэрэглэгч ашиглана.
        - Энэ endpoint нь create-ийн өмнөх туслах autofill endpoint юм.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plate_number:
                  type: string
            examples:
              Get_Vehicle:
                summary: Get Vehicle
                value:
                  plate_number: 1234УБА
  /api/broker/contract-lookup:
    post:
      tags:
      - commonEndpoints
      summary: Contract Lookup
      operationId: contractLookup
      description: |-
        plate_number эсвэл regnum-ээр бүх бүтээгдэхүүн (core_contracts) дундаас гэрээтэй эсэхийг шалгана.

        Заавал:
        - plate_number, regnum-ийн аль нэг нь заавал байх ёстой (хоёуланг нь илгээж болно)

        Буцаах бүтэц:
        - has_active_contract (boolean)
        - contracts[]: product_key, contract_number, status, plate_number, contract_created_at, contract_expires_at

        Анхаарах зүйл:
        - Зөвхөн иргэний regnum-аар хайна, байгууллагын regnum дэмжигдэхгүй.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plate_number:
                  type: string
                regnum:
                  type: string
            examples:
              Contract_Lookup:
                summary: Contract Lookup
                value:
                  plate_number: 1234УБА
                  regnum: ''
  /api/broker/products:
    get:
      tags:
      - commonEndpoints
      summary: Products
      operationId: products
      description: |-
        Dynamic broker API дээр ашиглах боломжтой бүтээгдэхүүний жагсаалтыг авна.

        Product бүр дээр:
        - id
        - key
        - name
        - is_active

        Одоогийн байдлаар:
        - thd
        - ht
        - god
        - thd_loan
        - ajd
        - sgo
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
  /api/broker/products/{product_key}/category:
    get:
      tags:
      - commonEndpoints
      summary: Get Category
      operationId: getCategory
      description: |-
        Сонгосон product_key-ийн category-г авна.

        Буцах category утгууд:
        - mashin
        - oron_suuts
        - ed_hurungu
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      parameters:
      - name: product_key
        in: path
        required: true
        schema:
          type: string
  /api/broker/{product_key}/get_sets:
    get:
      tags:
      - commonEndpoints
      summary: Get Sets
      operationId: getSets
      description: |-
        Сонгосон бүтээгдэхүүний багцын мэдээлэл авна.

        Буцаах common бүтэц:
        - set_name
        - is_active
        - protection_percent
        - own_responsibility
        - price_percent
        - is_limited
        - protected_risks

        Нэмэлт талбарууд:
        - god, sgo дээр insurance_type
        - god, sgo дээр protection_amount
        - god, sgo дээр price

        Тайлбар:
        - ajd нь [] буцаана
        - thd нь хуучин THD sets response-ээ яг тэр чигээр нь ашиглана
        - product_key утгууд: thd, ht, god, thd_loan, ajd, sgo
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      parameters:
      - name: product_key
        in: path
        required: true
        schema:
          type: string
  /api/broker/{product_key}/check_pay:
    post:
      tags:
      - commonEndpoints
      summary: Check Pay
      operationId: checkPay
      description: |-
        Төлбөрийн төлөв шалгана.

        Төлөгдсөн үед буцаах бүтэц:
        - code
        - is_paid
        - message
        - contract_url

        contract_show_url буцаахгүй. Хэрэв source endpoint contract_url буцаадаггүй бол broker controller өөрөө contract_url үүсгэнэ.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      parameters:
      - name: product_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contract_number:
                  type: string
            examples:
              Check_Pay:
                summary: Check Pay
                value:
                  contract_number: '{{contract_number}}'
  /api/broker/test/mark-paid:
    post:
      tags:
      - commonEndpoints
      summary: Test Mark Paid
      operationId: testMarkPaid
      description: |-
        Тестийн үед broker-ийн өөрийн гэрээг төлөгдсөн, insured төлөвт оруулна.

        Нөхцөл:
        - Зөвхөн brokers.test_user=true broker ашиглана
        - Authorization token заавал дамжуулна
        - Зөвхөн тухайн broker-ийн өөрийн contract_number ажиллана
        - thd, ht, god, thd_loan, ajd, sgo бүтээгдэхүүн дэмжинэ
        - Бодит төлбөр шалгахгүй
        - SMS болон campaign ticket үүсгэхгүй
        - Давтан дуудахад insured хэвээр success буцаана

        Success response:
        {
          "code": 0,
          "is_paid": 1,
          "is_insured": 1,
          "product_key": "ht",
          "contract_number": "CONTRACT_NUMBER",
          "message": "Тест төлбөр амжилттай төлөгдөж, гэрээ даатгагдлаа."
        }

        Test эрхгүй broker дээр HTTP 403 буцаана.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contract_number:
                  type: string
            examples:
              Test_Mark_Paid:
                summary: Test Mark Paid
                value:
                  contract_number: '{{contract_number}}'
  /api/broker/{product_key}/contract:
    post:
      tags:
      - commonEndpoints
      summary: Get Contract
      operationId: getContract
      description: Broker-ийн өөрийн үүсгэсэн нэг гэрээний дэлгэрэнгүй мэдээллийг авна.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      parameters:
      - name: product_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contract_number:
                  type: string
            examples:
              Get_Contract:
                summary: Get Contract
                value:
                  contract_number: '{{contract_number}}'
  /api/broker/{product_key}/contracts:
    post:
      tags:
      - commonEndpoints
      summary: Get Contracts
      operationId: getContracts
      description: |-
        Огнооны интервалаар гэрээнүүдийн жагсаалт авна.

        Дотоод date field:
        - ajd => contract_created_at
        - sgo => contract_created_at
        - бусад нь => created_at

        AJD status нь зөвхөн return дээр THD-style хэлбэрт хөрвөнө:
        - contract-create-success => insured
        - miis-invoice-success => pending
        - pre-contract-create => pending
        - contract-create-failed => failed
        - self-cancelled => cancelled
        - insurer-cancelled => cancelled
        - contract-expired => expired
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      parameters:
      - name: product_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                end_date:
                  type: string
            examples:
              Get_Contracts:
                summary: Get Contracts
                value:
                  start_date: '2026-05-01'
                  end_date: '2026-05-31'
  /api/broker/thd/create:
    post:
      tags:
      - thd
      summary: Create THD (Иргэн) / Create THD (Компани)
      operationId: createThd
      description: |-
        THD гэрээ үүсгэнэ.

        Заавал:
        - set
        - evaluation
        - type
        - vehicle
        - type=1 үед driver
        - type=2 үед company

        Анхаарах зүйл:
        - set утга нь get_sets-с авсан утга байна

        ---

        Байгууллагын THD гэрээ үүсгэнэ.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set:
                  type: string
                evaluation:
                  type: integer
                type:
                  type: integer
                BeginDate:
                  type: string
                vehicle:
                  type: object
                  properties:
                    plate_number:
                      type: string
                    color:
                      type: string
                    cabin_number:
                      type: string
                    mark:
                      type: string
                    model:
                      type: string
                    made_year:
                      type: integer
                    imported_date:
                      type: string
                driver:
                  type: object
                  properties:
                    familyname:
                      type: string
                    lastname:
                      type: string
                    firstname:
                      type: string
                    regnum:
                      type: string
                    driver_ln:
                      type: string
                    driver_ln_date:
                      type: string
                    address:
                      type: string
                    phone_number:
                      type: string
                    email:
                      type: string
                    nationality:
                      type: string
                    sex:
                      type: string
                    born_Date:
                      type: string
                    ZipCode:
                      type: string
            examples:
              Create_THD:
                summary: Create THD (Иргэн)
                value:
                  set: '{{set_value}}'
                  evaluation: 50000000
                  type: 1
                  BeginDate: '2026-05-20'
                  vehicle:
                    plate_number: 1234УБА
                    color: ЦАГААН
                    cabin_number: CABIN123
                    mark: TOYOTA
                    model: PRIUS
                    made_year: 2018
                    imported_date: '2018-01-01'
                  driver:
                    familyname: БАТ
                    lastname: БАТ
                    firstname: ДОРЖ
                    regnum: АБ12345678
                    driver_ln: '1234567'
                    driver_ln_date: '2015-01-01'
                    address: УБ
                    phone_number: '99112233'
                    email: test@example.com
                    nationality: MN
                    sex: male
                    born_Date: '1990-01-01'
                    ZipCode: '15160'
              Create_THD_2:
                summary: Create THD (Компани)
                value:
                  set: '{{set_value}}'
                  evaluation: 50000000
                  type: 2
                  BeginDate: '2026-05-20'
                  vehicle:
                    plate_number: 1234УБА
                    color: ЦАГААН
                    cabin_number: CABIN123
                    mark: TOYOTA
                    model: PRIUS
                    made_year: 2018
                    imported_date: '2018-01-01'
                  company:
                    regnum: '1234567'
                    name: TEST LLC
                    address: УБ
                    phone_number: '70112233'
                    ZipCode: '15160'
  /api/broker/thd/upload_photos:
    post:
      tags:
      - thd
      summary: Upload Photos THD
      operationId: uploadPhotosThd
      description: THD гэрээнд 4 зураг upload хийнэ.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
