            schema:
              type: object
              properties:
                set:
                  type: string
                insured_seats:
                  type: integer
                vehicle:
                  type: object
                  properties:
                    plate_number:
                      type: string
                driver:
                  type: object
                  properties:
                    regnum:
                      type: string
                    phone_number:
