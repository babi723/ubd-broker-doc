    post:
      tags:
      - ajd
      summary: Create AJD (Иргэн) / Create AJD (Компани)
      operationId: createAjd
      description: |-
        Иргэний AJD гэрээ үүсгэнэ.

        Тайлбар:
        - is_limited request дээрээс авахгүй
        - backend үргэлж false-аар MIIS рүү явуулна
        - co_drivers optional
        - nested driver/vehicle payload-ийг backend normalize хийж top-level request болгон ашиглана

        ---

        Байгууллагын AJD гэрээ үүсгэнэ.
      responses:
        '200':
          description: Амжилттай хариу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BrokerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: integer
                vehicle:
                  type: object
                  properties:
                    plate_number:
                      type: string
                    is_chirguul:
                      type: boolean
                driver:
                  type: object
                  properties:
                    lastname:
                      type: string
                    firstname:
                      type: string
                    regnum:
                      type: string
                    address:
                      type: string
                    phone_number:
                      type: string
                    email:
                      type: string
                co_drivers:
                  type: array
                  items: {}
            examples:
              Create_AJD:
                summary: Create AJD (Иргэн)
                value:
                  type: 1
                  vehicle:
                    plate_number: 1234УБА
                    is_chirguul: false
                  driver:
                    lastname: БАТ
                    firstname: ДОРЖ
                    regnum: АБ12345678
                    address: УБ
                    phone_number: '99112233'
                    email: test@example.com
                  co_drivers: []
              Create_AJD_2:
                summary: Create AJD (Компани)
                value:
                  type: 2
                  vehicle:
                    plate_number: 1234УБА
                    is_chirguul: false
                  company:
                    regnum: '1234567'
                    name: TEST COMPANY
                    address: УБ
                    phone_number: '70112233'
                    email: company@example.com
